<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Deteksi Potensi Hoaks</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <div class="container" id="input-section">
      <h1>Aplikasi Deteksi Potensi Hoaks</h1>
      <p class="subtitle">
        Aplikasi ini merupakan implementasi IndoBERT Fine-tuning untuk analisis
        potensi berita hoaks
      </p>
      <h3>Masukkan detail berita untuk analisis!</h3>


      <div class="form-group">
        <label for="judul">Masukkan judul berita <span class="required">*</span></label>
        <input
          type="text"
          id="judul"
          placeholder="Contoh: Pemerintah bagikan kuota gratis..."
        />
      </div>

      <div class="form-group">
        <label for="isi">Masukkan isi berita <span class="required">*</span></label>
        <textarea
          id="isi"
          placeholder="Salin dan tempel isi lengkap berita di sini..."
        ></textarea>
      </div>

      <button onclick="cekHoax()">Analisis Berita</button>
    </div>

    <div id="hasil-section" style="display: none"></div>
    
    <div id="loading">
      <div class="loader"></div>
      <p>Analisis berita sedang diproses...</p>
    </div>

    <!--pop up error-->
    <div id="errorModal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <h3>Terjadi Kesalahan</h3>
        <p id="modalErrorMessage"></p>
        <button class="modal-button" onclick="sembunyikanModalError()">
          Close
        </button>
      </div>
    </div>

    <footer>©2025 Henokh • Universitas Tarumanagara</footer>

    <script src="script.js"></script>
  </body>
</html>
